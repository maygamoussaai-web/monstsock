<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO de base -->
    <title>MonStock — Pilotez la rentabilité de votre boulangerie</title>
    <meta name="description" content="MonStock est l’outil de gestion conçu pour les boulangeries artisanales. Suivez vos stocks, vos fournées, vos ventes et votre marge brute — même sans connexion internet." />
    <meta name="keywords" content="gestion boulangerie, logiciel boulangerie, stock boulangerie, marge boulangerie, gestion inventaire Mali, application boulangerie Afrique" />
    <meta name="author" content="MonStock" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://monstsock.lovable.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MonStock" />
    <meta property="og:title" content="MonStock — Pilotez la rentabilité de votre boulangerie" />
    <meta property="og:description" content="Suivez chiffre d’affaires, coût matière, marge brute, pertes et stocks dans un outil conçu pour les boulangeries artisanales." />
    <meta property="og:url" content="https://monstsock.lovable.app/" />
    <meta property="og:image" content="https://monstsock.lovable.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MonStock — tableau de bord financier pour boulangeries" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MonStock — Pilotez la rentabilité de votre boulangerie" />
    <meta name="twitter:description" content="Stocks, fournées, ventes, marge brute : MonStock rend les chiffres de votre boulangerie lisibles et actionnables." />
    <meta name="twitter:image" content="https://monstsock.lovable.app/og-image.png" />

    <!-- PWA & icônes -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#c98a3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MonStock" />

    <!-- Données structurées JSON-LD : SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MonStock",
      "alternateName": "MonStock Boulangerie",
      "description": "Application de gestion pour boulangeries artisanales : stocks, fournées, ventes, marge brute et finances. Fonctionne hors ligne.",
      "url": "https://monstsock.lovable.app/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "XOF",
        "description": "Essai gratuit de 7 jours, sans carte bancaire"
      },
      "featureList": [
        "Gestion des stocks de matières premières",
        "Suivi des fournées et recettes",
        "Enregistrement des ventes",
        "Calcul de la marge brute",
        "Mode hors ligne",
        "Gestion multi-utilisateurs"
      ],
      "inLanguage": "fr",
      "audience": {
        "@type": "Audience",
        "audienceType": "Boulangers, artisans boulangers, gérants de boulangerie"
      },
      "provider": {
        "@type": "Organization",
        "name": "MonStock",
        "url": "https://monstsock.lovable.app/"
      }
    }
    </script>

    <!-- Préconnexion polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
