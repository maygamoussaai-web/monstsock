# Déploiement Netlify de MonStock.
# Le build utilise l'adaptateur officiel @netlify/vite-plugin-tanstack-start
# (activé automatiquement dans vite.config.ts quand NETLIFY=true) : il produit
# les fichiers statiques dans dist/client et la fonction SSR Netlify.
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
